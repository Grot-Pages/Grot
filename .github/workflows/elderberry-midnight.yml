name: All Product Midnight Refresh
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: all-product-midnight-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          npm install puppeteer gif-encoder-2 pngjs
          sudo apt-get update
          sudo apt-get install -y libgbm-dev fonts-noto-cjk
      - name: Generate all deadline images
        run: |
          node <<'NODE'
          const fs = require('fs');
          let code = fs.readFileSync('generate-gifs.js', 'utf8');
          const page = 'const p=await b.newPage();';
          if (!code.includes(page)) throw new Error('Unexpected browser setup');
          code = code.replace(page, page + 'await p.emulateTimezone("Asia/Seoul");');
          fs.writeFileSync('generate-all-midnight.cjs', code);
          NODE
          node generate-all-midnight.cjs
      - name: Commit all generated deadline images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nasal-event.gif elderberry-event.gif index-1.gif index-3.gif elderberry-deadline.png elderberry-notice.png index-4.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh all deadline images - $(date +'%Y-%m-%d %H:%M KST')"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
