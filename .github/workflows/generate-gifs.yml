name: Generate GIFs Daily
on:
  schedule:
    - cron: '5 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install puppeteer gif-encoder-2 pngjs
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgbm-dev
      - name: Generate GIFs
        run: node generate-gifs.js TZ Asia/Seoul
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nasal-event.gif elderberry-event.gif elderberry-notice.png index-1.gif index-3.gif index-4.png
          git diff --cached --quiet || (git commit -m "Update generated images - $(date +'%Y-%m-%d')" && git push)
