<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>엘더베리 이벤트 마감 안내</title><style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
*{margin:0;padding:0;box-sizing:border-box}html,body{background:#1e1e1e}.notice{position:relative;width:848px;height:1240px;overflow:hidden}.original{display:block;width:848px;height:1240px}.deadline{position:absolute;left:112px;top:877px;width:624px;height:141px;border-radius:17px;background:#d90000;color:white;display:flex;align-items:center;justify-content:center;font:700 62px 'Pretendard','Noto Sans CJK KR',sans-serif;letter-spacing:-2px;white-space:nowrap}
</style></head><body><div class="notice"><img class="original" src="https://shop-phinf.pstatic.net/20260922_212/1790043936721vq5Es_PNG/002.png?type=w860" alt="이벤트 마감 안내"><div class="deadline" id="deadline"></div></div><script>
function updateDeadline(){const p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric'}).formatToParts(new Date()).map(p=>[p.type,p.value]));document.getElementById('deadline').textContent=Number(p.month)+'월 '+Number(p.day)+'일 23시 59분'}updateDeadline();setInterval(updateDeadline,1000);
</script></body></html>
