<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>퓨리킬 엘더베리수액 이벤트</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
*{margin:0;padding:0;box-sizing:border-box}body{background:#fff;font-family:'Pretendard',sans-serif}
.banner{width:848px;height:1240px;background:#fff;text-align:center;padding-top:140px;color:#111}
.badge{display:flex;align-items:center;justify-content:center;width:288px;height:116px;margin:0 auto 52px;border-radius:16px;background:#315be6;color:white;font-size:70px;font-weight:600;letter-spacing:-2px}
h1{font-size:48px;line-height:1.3;font-weight:700;letter-spacing:-1.8px;margin-bottom:40px}
.stats{display:flex;align-items:center;width:768px;height:118px;background:#f4f4f4;margin:0 auto;color:#315be6}
.stat{flex:1;font-size:23px;line-height:1.6;font-weight:600;letter-spacing:-.5px}.divider{height:54px;width:1px;background:#315be6}
.event{position:absolute;top:810px;left:40px;width:768px;height:243px;border-radius:24px;background:#1c1c1c;color:white;display:flex;align-items:center;justify-content:center;flex-direction:column}
.label{font-size:44px;font-weight:300;margin-bottom:28px}.date{font-size:56px;font-weight:650;letter-spacing:-2px}
@keyframes blink{0%{opacity:1}8%{opacity:0}17%,100%{opacity:1}}.date{animation:blink 6s ease-in-out infinite}
</style></head><body><div class="banner"><div class="badge">Purikill</div><h1>재구매율 50% 달성 기념</h1><div class="stats"><div class="stat">퓨리킬<br>엘더베리 수액</div><div class="divider"></div><div class="stat">인공 감미료 無</div><div class="divider"></div><div class="stat">리뷰 평점<br>4.95점</div></div><div class="event"><div class="label">- 이벤트 기간 -</div><div class="date" id="eventDate"></div></div></div><script>
function koreaDate() { const p = new Intl.DateTimeFormat('en-CA', { timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit' }).formatToParts(new Date()); const v = Object.fromEntries(p.map(x => [x.type,x.value])); return new Date(Date.UTC(+v.year,+v.month-1,+v.day)); }
const today=koreaDate(),start=new Date(today);start.setUTCDate(today.getUTCDate()-7);const fmt=d=>(d.getUTCMonth()+1)+'월 '+d.getUTCDate()+'일';document.getElementById('eventDate').textContent=fmt(start)+' ~ '+fmt(today);
</script></body></html>
