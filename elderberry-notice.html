<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><style>@import url('https://fonts.googleapis.com/css2?family=Nanum+Gothic&display=swap');*{box-sizing:border-box;margin:0}body{background:white}.notice{width:848px;height:44px;display:flex;align-items:center;justify-content:center;color:#ff0010;font:19px 'Nanum Gothic',sans-serif}</style></head><body><div class="notice" id="notice"></div><script>const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),v=Object.fromEntries(p.map(x=>[x.type,x.value])),d=new Date(Date.UTC(+v.year,+v.month-1,+v.day));document.getElementById('notice').textContent='*'+(+v.month)+'월 '+(+v.day)+'일('+'일월화수목금토'[d.getUTCDay()]+') 긴급공지*';</script></body></html>
