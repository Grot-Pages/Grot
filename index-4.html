<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>긴급공지</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: #ffffff;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .notice {
      width: 600px;
      background: #ffffff;
      text-align: center;
      padding: 20px 60px 40px 60px;
      font-size: 14px;
      color: #000000;
      line-height: 23px;
    }

    .red {
      color: #ff0000;
    }

    .bold {
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="notice">
    <p>&lt;<span id="todayDate">4월 17일</span> 긴급공지&gt;</p>
    <p class="red bold">죄송합니다.</p>
    <p>여름철 기온과 습도가 상승하면서,</p>
    <p>녹농균, 레지오넬라균 등 호흡기를 자극하는</p>
    <p class="red bold">'습윤성 유해균'이 급증하고 있습니다.</p>
    <p>이로 인해 면역력이 취약한</p>
    <p>산후조리원과 어린이집의 대량 발주가 이어져,</p>
    <p>현재 준비된 <span class="red bold">재고 수량이 9개 미만</span>인 상황입니다.</p>
    <br/>
    <p>이에 따라 조금 더 많은 분들이 이용하실 수 있도록</p>
    <p>부득이하게 인당 최대 3개까지만 구매가 제한됩니다.</p>
    <br/>
    <p class="red bold">재고 수량이 9개 미만입니다.</p>
    <br/>
    <p>품절이 될지연정 완벽하게 만들겠습니다.</p>
    <p>잠시 품절이 되더라도 고객님의 너그러운 양해를 부탁드립니다.</p>
    <br/>
  </div>

  <script>
    (function () {
      var today = new Date();
      var m = today.getMonth() + 1;
      var d = today.getDate();
      document.getElementById('todayDate').textContent = m + '월 ' + d + '일';
    })();
  </script>
</body>
</html>
