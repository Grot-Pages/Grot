<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:#f5f2eb;font-family:Arial,'Apple SD Gothic Neo',sans-serif;color:#1f2a36}.banner{width:848px;height:1240px;padding:78px 64px;background:linear-gradient(145deg,#fffdf8,#e8f3f0);text-align:center;border:10px solid #173f46}.badge{display:inline-block;background:#173f46;color:#fff;padding:14px 34px;border-radius:40px;font-weight:700;font-size:30px;letter-spacing:2px}h1{font-size:68px;line-height:1.16;margin:64px 0 48px;color:#173f46;letter-spacing:-3px}.sub{font-size:33px;line-height:1.5;font-weight:700;color:#31434a;margin:0 auto 58px;word-break:keep-all}.line{height:4px;background:#d4a74d;margin:0 auto 58px;width:85%}.event{font-size:42px;font-weight:800;color:#b34833;margin-bottom:28px}.date{font-size:42px;font-weight:700;color:#173f46;background:#fff;padding:24px 18px;border-radius:16px;display:inline-block}.foot{margin-top:70px;font-size:27px;color:#647078}</style></head><body><div class="banner"><div class="badge">PURIKILL EVENT</div><h1>리뷰 800개 달성 기념</h1><p class="sub">퓨리킬 미관류 코세척기<br>전체 리뷰수 850개&nbsp; ⏐ &nbsp;3살 아이부터 사용</p><div class="line"></div><div class="event">이벤트 기간</div><div class="date" id="date"></div><div class="foot">여러분의 소중한 리뷰에 감사드립니다</div></div><script>function d(){let p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),v=Object.fromEntries(p.map(x=>[x.type,x.value])),t=new Date(Date.UTC(+v.year,+v.month-1,+v.day)),s=new Date(t);s.setUTCDate(s.getUTCDate()-7);let f=x=>x.getUTCMonth()+1+'월 '+x.getUTCDate()+'일';document.getElementById('date').textContent=f(s)+' ~ '+f(t)}d()</script></body></html>
